<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827">
<title>차량 운행기록</title>
<style>
*{box-sizing:border-box} body{margin:0;background:#f3f4f6;color:#111827;font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}
.wrap{max-width:520px;margin:auto;padding:16px 14px 40px}.top{display:flex;justify-content:space-between;align-items:center}
h1{font-size:27px;margin:8px 0}.date{color:#6b7280;margin-bottom:14px}
.card{background:#fff;border-radius:18px;padding:17px;margin:12px 0;box-shadow:0 2px 12px #0000000d}
.title{font-size:19px;font-weight:800;margin-bottom:13px} label{display:block;font-size:14px;font-weight:700;color:#4b5563;margin:10px 0 6px}
input,textarea{width:100%;font-size:18px;padding:12px;border:1px solid #d1d5db;border-radius:12px;background:#fff} textarea{min-height:68px;resize:vertical}
button{width:100%;border:0;border-radius:12px;padding:14px;margin-top:10px;font-size:17px;font-weight:800;background:#111827;color:white} button:disabled{opacity:.4}
.status{padding:11px 13px;border-radius:12px;background:#eef2ff;color:#3730a3;font-weight:700;line-height:1.45}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.box{background:#f9fafb;border-radius:12px;padding:12px}.small{font-size:13px;color:#6b7280}.big{font-size:21px;font-weight:900;margin-top:4px}
.record{border-top:1px solid #eee;padding:13px 0}.record:first-child{border-top:0}.record h3{margin:0 0 8px;font-size:17px}
.row{display:flex;justify-content:space-between;gap:12px;padding:5px 0}.value{font-weight:800;text-align:right}
.total{font-size:27px;font-weight:900}.danger{background:#fee2e2;color:#991b1b}.muted{color:#6b7280;font-size:13px;line-height:1.5}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><h1>🚐 차량 운행기록</h1></div>
  <div class="date" id="date"></div>
  <div class="status" id="status">오늘 운행을 시작해 주세요.</div>

  <section class="card">
    <div class="title">📊 차량 정보</div>
    <label>전일 누계 ODO (km)</label>
    <input id="prevOdo" type="number" inputmode="numeric" min="0" placeholder="예: 105310">
    <label>소속</label>
    <input id="dept" value="청소대장">
  </section>

  <section class="card">
    <div class="title">☀️ 오전 운행</div>
    <div class="grid">
      <div class="box"><div class="small">출발 시간</div><div class="big" id="amStartTime">-</div></div>
      <div class="box"><div class="small">출발 ODO</div><div class="big" id="amStartOdo">-</div></div>
    </div>
    <button id="amStart">오전 운행 시작</button>
    <div id="amEndArea" class="hidden">
      <label>종료 시 현재 ODO (km)</label>
      <input id="amEndOdo" type="number" inputmode="numeric" min="0" placeholder="계기판 숫자">
      <button id="amEnd">오전 운행 종료</button>
    </div>
  </section>

  <section class="card">
    <div class="title">🌤️ 오후 운행</div>
    <div class="grid">
      <div class="box"><div class="small">출발 시간</div><div class="big" id="pmStartTime">-</div></div>
      <div class="box"><div class="small">출발 ODO</div><div class="big" id="pmStartOdo">-</div></div>
    </div>
    <button id="pmStart" disabled>오후 운행 시작</button>
    <div id="pmEndArea" class="hidden">
      <label>종료 시 현재 ODO (km)</label>
      <input id="pmEndOdo" type="number" inputmode="numeric" min="0" placeholder="계기판 숫자">
      <button id="pmEnd">오후 운행 종료</button>
    </div>
  </section>

  <section class="card">
    <div class="title">📋 오늘 기록</div>
    <div id="summary" class="muted">아직 기록이 없습니다.</div>
  </section>

  <button id="reset" class="danger">오늘 기록 초기화</button>
</div>

<script>
const KEY="vehicle_log_v2";
let d=JSON.parse(localStorage.getItem(KEY)||"{}");
const $=id=>document.getElementById(id);
$("date").textContent=new Date().toLocaleDateString("ko-KR",{year:"numeric",month:"long",day:"numeric",weekday:"long"});
function now(){return new Date().toLocaleTimeString("ko-KR",{hour:"2-digit",minute:"2-digit"});}
function save(){localStorage.setItem(KEY,JSON.stringify(d));render();}
function n(id){return Number($(id).value);}
function odoOK(v){return Number.isFinite(v)&&v>=0;}
function km(v){return `${v.toLocaleString()} km`;}

$("amStart").onclick=()=>{
 const odo=n("prevOdo");
 if(!odoOK(odo)) return alert("출발 전에 전일 누계 ODO를 입력해 주세요.");
 d.prevOdo=odo; d.carNo=$("carNo").value; d.dept=$("dept").value;
 d.am={start:{time:now(),odo},duty:"소독·방역"};
 save();
};
$("amEnd").onclick=()=>{
 const odo=n("amEndOdo");
 if(!odoOK(odo)) return alert("오전 종료 ODO를 입력해 주세요.");
 if(odo<d.am.start.odo) return alert("종료 ODO가 출발 ODO보다 작습니다.");
 d.am.end={time:now(),odo}; d.am.km=odo-d.am.start.odo;
 save();
};
$("pmStart").onclick=()=>{
 const odo=d.am.end.odo;
 d.pm={start:{time:now(),odo},duty:"소독·방역"};
 save();
};
$("pmEnd").onclick=()=>{
 const odo=n("pmEndOdo");
 if(!odoOK(odo)) return alert("오후 종료 ODO를 입력해 주세요.");
 if(odo<d.pm.start.odo) return alert("종료 ODO가 출발 ODO보다 작습니다.");
 d.pm.end={time:now(),odo}; d.pm.km=odo-d.pm.start.odo;
 save();
};
$("reset").onclick=()=>{
 if(confirm("오늘 기록을 모두 초기화할까요?")){localStorage.removeItem(KEY);location.reload();}
};

function render(){
 const am=!!d.am, amEnd=!!d.am?.end, pm=!!d.pm, pmEnd=!!d.pm?.end;
 $("prevOdo").value=d.prevOdo??"";
 $("dept").value=d.dept??"청소대장";
 $("amStartTime").textContent=d.am?.start.time||"-";
 $("amStartOdo").textContent=d.am?.start.odo!=null?km(d.am.start.odo):"-";
 $("pmStartTime").textContent=d.pm?.start.time||"-";
 $("pmStartOdo").textContent=d.pm?.start.odo!=null?km(d.pm.start.odo):"-";
 $("amStart").disabled=am;
 $("prevOdo").disabled=am;
 $("amEndArea").classList.toggle("hidden",!am||amEnd);
 $("amEndOdo").value=d.am?.end?.odo??"";
 $("amEndOdo").disabled=amEnd;
 $("amEnd").disabled=!am||amEnd;
 $("pmStart").disabled=!amEnd||pm;
 $("pmEndArea").classList.toggle("hidden",!pm||pmEnd);
 $("pmEndOdo").value=d.pm?.end?.odo??"";
 $("pmEndOdo").disabled=pmEnd;
 $("pmEnd").disabled=!pm||pmEnd;

 if(!am)$("status").textContent="오늘 오전 운행을 시작해 주세요.";
 else if(!amEnd)$("status").textContent=`오전 운행 중 · ${d.am.start.time} 출발`;
 else if(!pm)$("status").textContent=`오전 완료 · ${d.am.km}km · 오후 운행을 시작해 주세요.`;
 else if(!pmEnd)$("status").textContent=`오후 운행 중 · ${d.pm.start.time} 출발`;
 else $("status").textContent=`오늘 운행 완료 · 총 ${d.am.km+d.pm.km}km`;

 let s="";
 if(am){
  s+=`<div class="record"><h3>☀️ 오전</h3>
  <div class="row"><span>출발</span><span class="value">${d.am.start.time} · ${km(d.am.start.odo)}</span></div>
  ${d.am.duty?`<div class="row"><span>용무</span><span class="value">${d.am.duty}</span></div>`:""}
  ${amEnd?`<div class="row"><span>도착</span><span class="value">${d.am.end.time} · ${km(d.am.end.odo)}</span></div><div class="row"><span>운행거리</span><span class="total">${d.am.km} km</span></div>`:""}</div>`;
 }
 if(pm){
  s+=`<div class="record"><h3>🌤️ 오후</h3>
  <div class="row"><span>출발</span><span class="value">${d.pm.start.time} · ${km(d.pm.start.odo)}</span></div>
  ${d.pm.duty?`<div class="row"><span>용무</span><span class="value">${d.pm.duty}</span></div>`:""}
  ${pmEnd?`<div class="row"><span>도착</span><span class="value">${d.pm.end.time} · ${km(d.pm.end.odo)}</span></div><div class="row"><span>운행거리</span><span class="total">${d.pm.km} km</span></div>`:""}</div>`;
 }
 if(amEnd||pmEnd){
  const total=(d.am?.km||0)+(d.pm?.km||0), final=d.pm?.end?.odo||d.am.end.odo;
  s+=`<div class="record"><h3>📊 당일 합계</h3>
  <div class="row"><span>전일 누계</span><span class="value">${km(d.prevOdo)}</span></div>
  <div class="row"><span>금일 운행</span><span class="total">${total} km</span></div>
  <div class="row"><span>누계</span><span class="total">${km(final)}</span></div></div>`;
 }
 $("summary").innerHTML=s||"아직 기록이 없습니다.";
}
render();
</script>
</body>
</html>
